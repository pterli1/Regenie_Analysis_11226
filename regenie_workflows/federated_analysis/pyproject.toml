[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedcat"
version = "0.8.1"
description = "Unified AoU + UKB GWAS discovery and forward-selection meta-conditioning runner"
authors = [{name = "Harry Wright", email = "h.wright4@exeter.ac.uk"}]
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9",
  "attrs>=23.0",
  # Native Rust extension. Not published to PyPI — installed before fedcat.
  # See regenie_workflows/create_working_directory.sh.
  "fedcat_rs>=0.1.7",
  "cattrs>=23.2",
  "dateparser>=1.2",
  "dxpy>=0.380",
  "google-auth>=2.30",
  "google-cloud-storage>=2.16",
  "loguru>=0.7",
  "numpy>=1.26",
  "polars>=1.39.0",
  "pyarrow>=14.0",
  "psutil>=5.9",
  "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["ruff==0.16.10"]
# Documentation site (mkdocs.yml, built with Zensical); ruff formats the API signatures
docs = [
  # 0.0.67 is the last release supporting Python 3.10, which fedcat supports
  "zensical==0.0.67",
  "mkdocstrings[python]>=1.0",
  "ruff==0.16.10",
]

[project.scripts]
fedcat = "fedcat.__main__:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["fedcat*"]

[tool.pytest.ini_options]
testpaths = ["fedcat/tests"]

# Lint and format (black-compatible); keep line-length equal to the repo root pyproject.toml
[tool.ruff]
line-length = 114
target-version = "py310"

[tool.ruff.lint]
# Local wall-clock time is intended (--delay-start, log timestamps)
ignore = ["DTZ"]
# so logger.exception() counts as handling an exception
logger-objects = ["loguru.logger"]
