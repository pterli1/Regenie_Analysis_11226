site_name: FedCAT
site_description: Federated Conditional Association Testing across All of Us and UK Biobank
site_url: https://exetergenetics.github.io/fedcat/
repo_url: https://github.com/ExeterGenetics/biobank_workflows
repo_name: ExeterGenetics/biobank_workflows
edit_uri: edit/main/regenie_workflows/federated_analysis/docs/
copyright: University of Exeter

theme:
  name: material
  logo: fedcat_logo.png
  favicon: fedcat_logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

# Build with Zensical after generating the reference content:
#   python tools/docs/gen_docs.py && zensical serve
# The same configuration builds with MkDocs 1.x.
plugins:
  - search
  # docs/options_reference.md is for reading on GitHub; the site has a page per command
  - exclude:
      glob:
        - options_reference.md
  # A page per public module of fedcat, under Reference > API reference
  - api-autonav:
      modules: [fedcat]
      exclude: [fedcat.tests, fedcat._blas_threads]
      # Keep fedcat.__main__, the command line
      exclude_private: false
      nav_section_title: API reference
      api_root_uri: reference/api
      # No symbol badge before each module's name in the nav
      nav_item_prefix: ""
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # build/docs_stubs holds the fedcat_rs stub, staged by tools/docs/gen_docs.py
          paths: [build/docs_stubs, .]
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            docstring_style: google
            docstring_options:
              # Types come from the signatures, not the docstrings
              warn_missing_types: false
            docstring_section_style: table
            show_source: false
            show_labels: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: false
            filters: ["!^_"]
            heading_level: 1

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  # Content generated by tools/docs/gen_docs.py, included with --8<--
  - pymdownx.snippets:
      base_path: [build/docs_snippets]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quick-start.md
  - User guide:
      - How a run works: guide/how-it-works.md
      - Configuration: guide/configuration.md
      - Running and resuming: guide/running.md
      - Meta-analysis and ACAT: guide/meta-analysis.md
      - Conditioning: guide/conditioning.md
      - Outputs: guide/outputs.md
      - Troubleshooting: guide/troubleshooting.md
  - Commands:
      - commands/index.md
      - discover: commands/discover.md
      - setup-workflows: commands/setup-workflows.md
      - cromwell: commands/cromwell.md
      - meta: commands/meta.md
      - acat: commands/acat.md
      - convert-annots: commands/convert-annots.md
      - subset-results: commands/subset-results.md
      - summarise-indep: commands/summarise-indep.md
      - collinearity: commands/collinearity.md
  - Reference:
      - Config file: reference/config.md
      - Changelog: reference/changelog.md
      - API reference:
          # The Rust extension, from its type stub; api-autonav adds the fedcat package
          - fedcat_rs: reference/api/fedcat_rs.md
  - Development:
      - Building these docs: development/building-docs.md
      - Docstring conventions: docstring_conventions.md
      - Deferred work: future_work.md
